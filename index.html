<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>فرم ورود</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <section class="card" aria-labelledby="signup-title">
        <h1 id="signup-title">ثبت نام</h1>
        <p class="subtitle">برای ایجاد حساب اطلاعات خود را وارد کنید</p>

        <form class="form" action="#" method="post">
          <label for="first-name">نام</label>
          <input id="first-name" name="first-name" type="text" placeholder="نام" required />

          <label for="last-name">نام خانوادگی</label>
          <input id="last-name" name="last-name" type="text" placeholder="نام خانوادگی" required />

          <label for="signup-password">رمز عبور</label>
          <input
            id="signup-password"
            name="password"
            type="password"
            placeholder="رمز عبور"
            required
          />

          <label for="school">مدرسه</label>
          <input id="school" name="school" type="text" placeholder="نام مدرسه" required />

          <label for="grade">پایه تحصیلی</label>
          <select id="grade" name="grade" required>
            <option value="" disabled selected>پایه را انتخاب کنید</option>
            <option value="7">پایه هفتم</option>
            <option value="8">پایه هشتم</option>
            <option value="9">پایه نهم</option>
            <option value="10">پایه دهم</option>
            <option value="11">پایه یازدهم</option>
            <option value="12">پایه دوازدهم</option>
          </select>

          <button type="submit">ثبت نام</button>
        </form>
      </section>

      <section class="card" aria-labelledby="login-title">
        <h2 id="login-title">ورود</h2>
        <p class="subtitle">اگر حساب دارید وارد شوید</p>

        <form class="form" action="#" method="post">
          <label for="login-name">نام</label>
          <input id="login-name" name="login-name" type="text" placeholder="نام" required />

          <label for="login-password">رمز عبور</label>
          <input
            id="login-password"
            name="login-password"
            type="password"
            placeholder="رمز عبور"
            required
          />

          <button type="submit">ورود</button>
        </form>
      </section>
    </main>
  </body>
</html>
